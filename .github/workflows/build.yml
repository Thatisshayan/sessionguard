name: Build Desktop App

on:
  push:
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows (MSI + NSIS)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Install Node deps
        run: cd frontend && npm ci

      - name: Install desktop shell deps
        run: cd desktop_shell && npm ci

      - name: Prepare bundled Python runtime
        run: pwsh -File scripts/bundle/bundle_python_win.ps1

      - name: Build frontend
        run: cd frontend && npm run build

      - name: Stage backend sources
        env:
          SESSIONGUARD_REQUIRE_BUNDLED_PYTHON: "1"
        run: node desktop_shell/stage-backend.js

      - name: Build Tauri app (PR smoke)
        if: ${{ github.event_name == 'pull_request' }}
        env:
          SESSIONGUARD_REQUIRE_BUNDLED_PYTHON: "1"
        run: cd desktop_shell && npx tauri build --target x86_64-pc-windows-msvc

      - name: Build Tauri app (release)
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SESSIONGUARD_REQUIRE_BUNDLED_PYTHON: "1"
          # Code signing (optional — only runs if secrets are set)
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'SessionGuard ${{ github.ref_name }}'
          releaseBody: 'See the assets to download this version and install.'
          releaseDraft: false
          prerelease: false
          args: --target x86_64-pc-windows-msvc
